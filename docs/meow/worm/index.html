<!doctype html>
<html lang="zh-CN">
<head>
<script>window.MEOW_WS_BASE = "wss://kbcraft.cn:3090/m3ow";</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08150e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>猫猫虫 · WORMY</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9B%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>
  <canvas id="gl"></canvas>
  <canvas id="top"></canvas>

  <div id="hud">
    <div class="top">
      <div class="scoreBox">
        <small>SCORE</small><b id="score">0</b><i id="lenTxt">LEN 6</i>
      </div>
      <div class="topRight">
        <div id="board" class="board"></div>
        <div class="icons">
          <button id="muteBtn" class="iconBtn on" aria-label="声音">♪</button>
          <a href="/" class="iconBtn" aria-label="返回游戏厅">←</a>
        </div>
      </div>
    </div>
    <div class="bottom">
      <span id="online" class="online">草地 0 条</span>
      <span class="tip">按住屏幕转向</span>
    </div>
  </div>

  <canvas id="mini" class="mini" width="180" height="180"></canvas>
  <div id="toast" class="toast"></div>

  <!-- 进入 -->
  <div id="menu" class="screen">
    <div class="panel">
      <div class="tag">WORMY · 04 · ONLINE</div>
      <h1>猫猫<span>虫</span></h1>
      <p class="lead">同一片草地上，吃叶子变长，<br>头撞到别人的身体就变成午餐喵。</p>

      <div class="tips"><i>摇杆转向</i><i>推到底冲刺</i><i>猫爪震退</i><i>传送洞</i><i>金果雨</i></div>

      <div class="skinRow" id="skinRow"></div>

      <div class="nameRow">
        <input id="nameInput" maxlength="10" placeholder="你的猫猫虫名字" autocomplete="off">
      </div>

      <button id="joinBtn" class="btn">钻 进 草 地</button>
      <div id="menuMsg" class="menuMsg"></div>
      <div class="footNote">按住屏幕 / 鼠标转向 · 左右方向键也能拐</div>
    </div>
  </div>

  <!-- 死亡 -->
  <div id="dead" class="screen hide">
    <div class="panel">
      <div class="tag" id="deadTag">被吃掉了</div>
      <div class="face">=︿･︿=</div>
      <h2 id="deadTitle">撞到别人身上了喵</h2>
      <div class="resultGrid">
        <div><small>本局得分</small><b id="finalScore">0</b></div>
        <div><small>身体长度</small><b id="finalLen">6</b></div>
        <div><small>击杀</small><b id="finalKill">0</b></div>
        <div><small>草地排名</small><b id="finalRank">-</b></div>
      </div>
      <button id="respawnBtn" class="btn">立 刻 复 活</button>
      <a class="btn ghost" href="/">回 游 戏 厅</a>
      <div class="footNote" id="respawnHint">3 秒后自动复活</div>
    </div>
  </div>
</div>
<script src="gl.js"></script>
<script src="game.js"></script>
</body>
</html>
